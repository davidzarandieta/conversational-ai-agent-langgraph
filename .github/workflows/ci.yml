name: CI/CD & Behavioral Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  security-and-quality:
    name: Security Scan & Architecture Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks - Detect Hardcoded Secrets
        uses: gitleaks/gitleaks-action@v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      - name: Run Pytest Suite (Unit, Concurrency & Guardrails)
        env:
          JWT_SECRET: dummy_jwt_test_secret_for_tests
          ANTHROPIC_API_KEY: sk-ant-test-dummy-key
          MONGO_URI: mongodb://localhost:27017/
          COOKIE_SECURE: "false"
        run: |
          PYTHONPATH=. pytest tests/ -v

      - name: Run Evals Suite (12 Golden Cases - Replay/Cache Mode)
        run: |
          PYTHONPATH=. python -m evals.runner

  deploy-pages:
    name: Deploy Interactive Demo to GitHub Pages
    needs: security-and-quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (docs directory)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
