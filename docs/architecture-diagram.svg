<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="accentRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.35">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
    <line x1="0" y1="660" x2="1200" y2="660"/>
    <line x1="200" y1="0" x2="200" y2="780"/>
    <line x1="450" y1="0" x2="450" y2="780"/>
    <line x1="700" y1="0" x2="700" y2="780"/>
    <line x1="950" y1="0" x2="950" y2="780"/>
  </g>

  <!-- ========================================================================= -->
  <!-- HEADER & BADGES                                                           -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 45)">
    <circle cx="10" cy="10" r="6" fill="#10b981" filter="url(#glow)"/>
    <text x="28" y="15" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">CONVERSATIONAL AI AGENT — REFERENCE ARCHITECTURE</text>
    <text x="28" y="34" fill="#94a3b8" font-size="13" font-weight="400">StateGraph Lifecycle • Deterministic Guardrails • Concurrency Lock • Resilient Parser Cascade</text>
    
    <rect x="850" y="-3" width="130" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="915" y="13" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">LangGraph v0.2+</text>

    <rect x="990" y="-3" width="110" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="1045" y="13" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Python 3.10+</text>
  </g>

  <!-- ========================================================================= -->
  <!-- TOP ROW: INBOUND & PRECONDITIONS & PREPROCESS & BRAIN                     -->
  <!-- ========================================================================= -->

  <!-- Inbound Trigger -->
  <g transform="translate(60, 110)">
    <rect width="130" height="95" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="14" y="12" width="28" height="28" rx="6" fill="#3b82f6" opacity="0.2"/>
    <text x="28" y="31" fill="#60a5fa" font-size="15" text-anchor="middle">⚡</text>
    <text x="50" y="27" fill="#94a3b8" font-size="11" font-weight="600">INBOUND</text>
    <text x="50" y="41" fill="#f8fafc" font-size="12" font-weight="600">ManyChat</text>
    <text x="14" y="65" fill="#64748b" font-size="10">Webhook Trigger</text>
    <text x="14" y="79" fill="#38bdf8" font-size="9" font-family="monospace">find_one_and_update</text>
  </g>

  <!-- Arrow: Inbound -> Node 1 -->
  <path d="M 190 157 L 240 157" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NODE 1: validate_preconditions -->
  <g transform="translate(245, 110)">
    <rect width="210" height="135" rx="10" fill="#111827" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="14" y="12" width="28" height="28" rx="6" fill="#3b82f6" opacity="0.2"/>
    <text x="28" y="30" fill="#60a5fa" font-size="14" text-anchor="middle">1</text>
    <text x="50" y="25" fill="#60a5fa" font-size="11" font-weight="700">NODE 1</text>
    <text x="50" y="38" fill="#f8fafc" font-size="12" font-weight="600">validate_preconditions</text>
    
    <line x1="14" y1="48" x2="196" y2="48" stroke="#1e293b"/>
    <circle cx="22" cy="62" r="3" fill="#38bdf8"/>
    <text x="32" y="66" fill="#94a3b8" font-size="10">Billing status (Active / Paused)</text>
    
    <circle cx="22" cy="80" r="3" fill="#38bdf8"/>
    <text x="32" y="84" fill="#94a3b8" font-size="10">Excluded leads list check</text>
    
    <circle cx="22" cy="98" r="3" fill="#38bdf8"/>
    <text x="32" y="102" fill="#94a3b8" font-size="10">Bot sleep schedule schedule</text>

    <rect x="14" y="112" width="182" height="15" rx="3" fill="#0f172a"/>
    <text x="105" y="123" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="middle">Zero Token Waste Guard</text>
  </g>

  <!-- Conditional Edge 1: Abort (Down) -->
  <path d="M 350 245 L 350 300" fill="none" stroke="#f87171" stroke-width="1.75" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <rect x="358" y="260" width="70" height="18" rx="4" fill="#450a0a" stroke="#991b1b" stroke-width="0.75"/>
  <text x="393" y="273" fill="#fca5a5" font-size="9" font-weight="600" text-anchor="middle">Locked / Sleep</text>

  <!-- ABORT END 1 -->
  <g transform="translate(305, 305)">
    <rect width="90" height="36" rx="6" fill="#1f1315" stroke="#7f1d1d" stroke-width="1"/>
    <text x="45" y="16" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle">END (Abort)</text>
    <text x="45" y="28" fill="#fca5a5" font-size="8" text-anchor="middle">Lock released</text>
  </g>

  <!-- Arrow: Node 1 -> Node 2 -->
  <path d="M 455 157 L 500 157" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="478" y="150" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">Pass</text>

  <!-- NODE 2: preprocess_media -->
  <g transform="translate(505, 110)">
    <rect width="190" height="135" rx="10" fill="#111827" stroke="#8b5cf6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="14" y="12" width="28" height="28" rx="6" fill="#8b5cf6" opacity="0.2"/>
    <text x="28" y="30" fill="#a78bfa" font-size="14" text-anchor="middle">2</text>
    <text x="50" y="25" fill="#a78bfa" font-size="11" font-weight="700">NODE 2</text>
    <text x="50" y="38" fill="#f8fafc" font-size="12" font-weight="600">preprocess_media</text>

    <line x1="14" y1="48" x2="176" y2="48" stroke="#1e293b"/>
    <circle cx="22" cy="62" r="3" fill="#a78bfa"/>
    <text x="32" y="66" fill="#94a3b8" font-size="10">Audio note transcribe (Whisper)</text>
    
    <circle cx="22" cy="80" r="3" fill="#a78bfa"/>
    <text x="32" y="84" fill="#94a3b8" font-size="10">Image base64 (Vision API)</text>
    
    <circle cx="22" cy="98" r="3" fill="#a78bfa"/>
    <text x="32" y="102" fill="#94a3b8" font-size="10">Passthrough on plain text</text>

    <rect x="14" y="112" width="162" height="15" rx="3" fill="#0f172a"/>
    <text x="95" y="123" fill="#c084fc" font-size="9" font-family="monospace" text-anchor="middle">Multimodal Ingestion</text>
  </g>

  <!-- Arrow: Node 2 -> Node 3 -->
  <path d="M 695 157 L 740 157" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NODE 3: run_ai_brain (LLM Core) -->
  <g transform="translate(745, 95)">
    <rect width="230" height="165" rx="10" fill="#111827" stroke="#ec4899" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#ec4899" opacity="0.2"/>
    <text x="28" y="33" fill="#f472b6" font-size="14" text-anchor="middle">3</text>
    <text x="50" y="27" fill="#f472b6" font-size="11" font-weight="700">NODE 3 (Core)</text>
    <text x="50" y="41" fill="#f8fafc" font-size="13" font-weight="700">run_ai_brain</text>

    <line x1="14" y1="52" x2="216" y2="52" stroke="#1e293b"/>
    <circle cx="22" cy="68" r="3" fill="#f472b6"/>
    <text x="32" y="72" fill="#f1f5f9" font-size="11" font-weight="600">Anthropic Claude 3.5 Sonnet</text>
    
    <circle cx="22" cy="88" r="3" fill="#f472b6"/>
    <text x="32" y="92" fill="#cbd5e1" font-size="10">Ephemeral Prompt Caching</text>
    <text x="32" y="105" fill="#10b981" font-size="9">⚡ 90% Cost &amp; Latency Reduction</text>
    
    <circle cx="22" cy="120" r="3" fill="#f472b6"/>
    <text x="32" y="124" fill="#cbd5e1" font-size="10">Dynamic Self-Repair Loop</text>
    <text x="32" y="137" fill="#94a3b8" font-size="9">Injects fix on broken JSON retry</text>

    <rect x="14" y="144" width="202" height="15" rx="3" fill="#0f172a"/>
    <text x="115" y="155" fill="#f472b6" font-size="9" font-family="monospace" text-anchor="middle">Reasoning &amp; Strategy Engine</text>
  </g>

  <!-- Conditional Edge: AI Error / Quota (Right & Down) -->
  <path d="M 975 165 L 1020 165 L 1020 220" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <rect x="1030" y="175" width="80" height="18" rx="4" fill="#450a0a" stroke="#991b1b" stroke-width="0.75"/>
  <text x="1070" y="188" fill="#fca5a5" font-size="8" font-weight="600" text-anchor="middle">Quota Exceeded</text>

  <g transform="translate(975, 225)">
    <rect width="90" height="34" rx="6" fill="#1f1315" stroke="#7f1d1d" stroke-width="1"/>
    <text x="45" y="15" fill="#f87171" font-size="9" font-weight="700" text-anchor="middle">END (Abort)</text>
    <text x="45" y="27" fill="#fca5a5" font-size="8" text-anchor="middle">Billing lock active</text>
  </g>

  <!-- Connecting Path from Node 3 down to Node 4 -->
  <path d="M 860 260 L 860 395 L 200 395 L 200 450 L 240 450" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="490" y="386" width="130" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="555" y="399" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">Valid Inference Generated</text>

  <!-- ========================================================================= -->
  <!-- BOTTOM ROW: GUARDRAILS, BOOKING RULES, DELIVERY, PERSISTENCE              -->
  <!-- ========================================================================= -->

  <!-- NODE 4: apply_guardrails -->
  <g transform="translate(245, 410)">
    <rect width="210" height="145" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="14" y="12" width="28" height="28" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="28" y="30" fill="#fbbf24" font-size="14" text-anchor="middle">4</text>
    <text x="50" y="25" fill="#fbbf24" font-size="11" font-weight="700">NODE 4</text>
    <text x="50" y="38" fill="#f8fafc" font-size="12" font-weight="600">apply_guardrails</text>

    <line x1="14" y1="48" x2="196" y2="48" stroke="#1e293b"/>
    <circle cx="22" cy="62" r="3" fill="#fbbf24"/>
    <text x="32" y="66" fill="#94a3b8" font-size="10">Forbidden chars (¿, ¡ stripped)</text>
    
    <circle cx="22" cy="80" r="3" fill="#fbbf24"/>
    <text x="32" y="84" fill="#94a3b8" font-size="10">Tone &amp; capitalization rules</text>
    
    <circle cx="22" cy="98" r="3" fill="#fbbf24"/>
    <text x="32" y="102" fill="#94a3b8" font-size="10">Blocked fallback phrase filter</text>
    <text x="32" y="115" fill="#ef4444" font-size="9">Prevents technical error leaks</text>

    <rect x="14" y="122" width="182" height="15" rx="3" fill="#0f172a"/>
    <text x="105" y="133" fill="#fbbf24" font-size="9" font-family="monospace" text-anchor="middle">Deterministic Safety Layer</text>
  </g>

  <!-- Arrow: Node 4 -> Node 5 -->
  <path d="M 455 480 L 500 480" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NODE 5: enforce_booking_rules (Calendly Injection) -->
  <g transform="translate(505, 410)">
    <rect width="210" height="145" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="14" y="12" width="28" height="28" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="28" y="30" fill="#34d399" font-size="14" text-anchor="middle">5</text>
    <text x="50" y="25" fill="#34d399" font-size="11" font-weight="700">NODE 5</text>
    <text x="50" y="38" fill="#f8fafc" font-size="12" font-weight="600">enforce_booking_rules</text>

    <line x1="14" y1="48" x2="196" y2="48" stroke="#1e293b"/>
    <circle cx="22" cy="62" r="3" fill="#34d399"/>
    <text x="32" y="66" fill="#f1f5f9" font-size="10" font-weight="600">2-Layer Booking Detection</text>
    <text x="32" y="78" fill="#94a3b8" font-size="9">Capa 1: Regex explícito</text>
    <text x="32" y="90" fill="#94a3b8" font-size="9">Capa 2: Confirmación contextual</text>
    
    <circle cx="22" cy="105" r="3" fill="#34d399"/>
    <text x="32" y="109" fill="#38bdf8" font-size="10" font-weight="600">Deterministic Link Injection</text>
    <text x="32" y="120" fill="#94a3b8" font-size="9">Guarantees Calendly URL insertion</text>

    <rect x="14" y="126" width="182" height="15" rx="3" fill="#0f172a"/>
    <text x="105" y="137" fill="#34d399" font-size="9" font-family="monospace" text-anchor="middle">Zero Hallucination Booking</text>
  </g>

  <!-- Arrow: Node 5 -> Node 6 -->
  <path d="M 715 480 L 760 480" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NODE 6: deliver_messages -->
  <g transform="translate(765, 410)">
    <rect width="210" height="145" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="14" y="12" width="28" height="28" rx="6" fill="#38bdf8" opacity="0.2"/>
    <text x="28" y="30" fill="#38bdf8" font-size="14" text-anchor="middle">6</text>
    <text x="50" y="25" fill="#38bdf8" font-size="11" font-weight="700">NODE 6</text>
    <text x="50" y="38" fill="#f8fafc" font-size="12" font-weight="600">deliver_messages</text>

    <line x1="14" y1="48" x2="196" y2="48" stroke="#1e293b"/>
    <circle cx="22" cy="62" r="3" fill="#38bdf8"/>
    <text x="32" y="66" fill="#f1f5f9" font-size="10" font-weight="600">Race Condition Pre-Check</text>
    <text x="32" y="78" fill="#94a3b8" font-size="9">Did human pause while AI thought?</text>
    
    <circle cx="22" cy="95" r="3" fill="#38bdf8"/>
    <text x="32" y="99" fill="#cbd5e1" font-size="10">Dispatches to ManyChat API</text>
    <text x="32" y="111" fill="#94a3b8" font-size="9">Sequenced multi-bubble messages</text>

    <rect x="14" y="122" width="182" height="15" rx="3" fill="#0f172a"/>
    <text x="105" y="133" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="middle">Human-in-the-Loop Safe</text>
  </g>

  <!-- Conditional Edge: Human Paused (Down) -->
  <path d="M 870 555 L 870 600" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <rect x="880" y="565" width="85" height="18" rx="4" fill="#450a0a" stroke="#991b1b" stroke-width="0.75"/>
  <text x="922" y="577" fill="#fca5a5" font-size="8" font-weight="600" text-anchor="middle">Human Paused</text>

  <!-- ABORT END 2 -->
  <g transform="translate(825, 605)">
    <rect width="90" height="34" rx="6" fill="#1f1315" stroke="#7f1d1d" stroke-width="1"/>
    <text x="45" y="15" fill="#f87171" font-size="9" font-weight="700" text-anchor="middle">END (Abort)</text>
    <text x="45" y="27" fill="#fca5a5" font-size="8" text-anchor="middle">Delivery cancelled</text>
  </g>

  <!-- Arrow: Node 6 -> Node 7 -->
  <path d="M 975 480 L 1010 480 L 1010 575 L 200 575 L 200 640 L 240 640" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="568" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">Delivery Confirmed via Webhook</text>

  <!-- NODE 7: persist_state_and_schedule -->
  <g transform="translate(245, 600)">
    <rect width="360" height="95" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="14" y="12" width="28" height="28" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="28" y="30" fill="#34d399" font-size="14" text-anchor="middle">7</text>
    <text x="50" y="25" fill="#34d399" font-size="11" font-weight="700">NODE 7</text>
    <text x="50" y="38" fill="#f8fafc" font-size="12" font-weight="600">persist_state_and_schedule</text>

    <line x1="14" y1="46" x2="346" y2="46" stroke="#1e293b"/>
    <circle cx="22" cy="58" r="3" fill="#34d399"/>
    <text x="32" y="62" fill="#94a3b8" font-size="10">Appends conversation turns to MongoDB history</text>
    
    <circle cx="22" cy="74" r="3" fill="#34d399"/>
    <text x="32" y="78" fill="#94a3b8" font-size="10">Releases atomic processing lock: <tspan fill="#38bdf8" font-family="monospace">is_processing: false</tspan></text>
  </g>

  <!-- Arrow: Node 7 -> END -->
  <path d="M 605 647 L 670 647" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- FINAL END -->
  <g transform="translate(675, 620)">
    <rect width="130" height="54" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="65" y="25" fill="#a7f3d0" font-size="12" font-weight="700" text-anchor="middle">END (Success)</text>
    <text x="65" y="42" fill="#ecfdf5" font-size="10" text-anchor="middle">Turn Completed</text>
  </g>

  <!-- FOOTER / LEGEND -->
  <g transform="translate(60, 725)">
    <rect x="0" y="0" width="1080" height="35" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <circle cx="30" cy="17" r="4" fill="#38bdf8"/>
    <text x="42" y="21" fill="#cbd5e1" font-size="11">LangGraph Nodes</text>

    <circle cx="180" cy="17" r="4" fill="#34d399"/>
    <text x="192" y="21" fill="#cbd5e1" font-size="11">Happy Path Transitions</text>

    <circle cx="370" cy="17" r="4" fill="#f87171"/>
    <text x="382" y="21" fill="#cbd5e1" font-size="11">Conditional Abort Branches (Zero Token Waste / Human Safe)</text>

    <text x="1060" y="21" fill="#64748b" font-size="11" text-anchor="end">Production Reference Architecture • MIT License</text>
  </g>

</svg>
